<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <body>
    <div class="app">
      <header class="app__header">
        <div class="search-bar">
          <input type="text" placeholder="Type in a city name" />
          <button>FIND WEATHER</button>
        </div>
        <p></p>
      </header>
      <main class="app__main">
        <div class="general_weather">
          <figure>
            <img
              src="./weather-icons/unknown.svg"
              alt="general weather"
              width="208px"
            />
            <figcaption></figcaption>
          </figure>
          <div class="temperature">
            <span><b>Temperature</b></span
            ><span class="min-temp"></span>to<span class="max-temp"></span>
          </div>
          <div class="humidity&pressure">
            <span><b>Humidity</b></span
            ><span class="humidity"></span><span><b>Pressure</b></span
            ><span class="pressure"></span>
          </div>
        </div>
        <div class="weather_changes"></div>
        <p class="error-message"></p>
      </main>
    </div>
  </body>
</html>
